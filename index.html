<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUMA — Autentikasi dan Dashboard</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#253a32;background:#f6f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,a{font:inherit}a{color:inherit}button,.button{cursor:pointer;border:0;border-radius:10px;padding:13px 18px;background:#254d3d;color:white;font-weight:650;text-decoration:none;display:inline-block}button:disabled{opacity:.6;cursor:wait}button.secondary{background:#e8ece5;color:#254d3d}input{width:100%;padding:13px;border:1px solid #cbd3c9;border-radius:9px;background:#fff;margin-top:7px;color:inherit}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b08848;outline-offset:3px}label{display:block;font-size:14px;font-weight:600;margin-bottom:18px}.brand{font-size:30px;font-weight:850;letter-spacing:-2px;text-decoration:none}.brand span{color:#a28143}p{line-height:1.65;color:#607168}h1{font-size:clamp(30px,4vw,44px);letter-spacing:-1.5px;line-height:1.12}h2{font-size:22px}.eyebrow{letter-spacing:2px;font-size:11px;font-weight:750}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.story{background:#254d3d;color:#f8f5e9;padding:clamp(30px,7vw,100px);display:flex;flex-direction:column;justify-content:space-between}.story p{color:#ced8cb}.story h2{font-size:clamp(36px,5vw,66px);letter-spacing:-2px;font-weight:500}.art{height:125px;display:flex;align-items:end;gap:18px;margin:40px 0}.art i{display:block;background:#a7b59a;border-radius:60px 60px 5px 5px;width:90px;height:100%}.art i:nth-child(2){height:70%;background:#d6ba87}.art i:nth-child(3){height:45%;background:#e6e1d0}.form-wrap{padding:40px 24px;display:grid;place-items:center}.card{width:100%;max-width:410px}.full{width:100%}.note{font-size:12px;padding:12px 14px;background:#eee9d9;border-radius:9px;color:#695d3c}.error{color:#a33232;min-height:22px;font-size:14px}.switch{text-align:center;font-size:14px}.shell{max-width:1180px;margin:auto;padding:28px}.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:25px;border-bottom:1px solid #dce1d6}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0}.nav a{padding:10px 16px;border-radius:30px;text-decoration:none;background:white}.nav a[aria-current=page]{background:#254d3d;color:white}.welcome{padding:30px 0}.welcome p{max-width:590px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.tile{background:#fff;border:1px solid #e0e4da;border-radius:16px;padding:25px}.tile strong{display:block;font-size:35px;margin:20px 0 8px}.tile small{color:#607168}.panel{margin-top:24px;padding:28px;border-radius:18px;background:#e7eadf}.muted{color:#607168;font-size:13px}.skeleton{height:165px;border-radius:16px;background:linear-gradient(100deg,#e4e7df 30%,#f3f4ef 50%,#e4e7df 70%);background-size:220% 100%;animation:shimmer 1.2s infinite}.enter{animation:enter .2s ease-out}h1:focus{outline:none}@keyframes shimmer{to{background-position:-220% 0}}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:760px){.auth{grid-template-columns:1fr}.story{padding:25px}.story h2,.art,.story>p{display:none}.grid{grid-template-columns:1fr}.shell{padding:20px}.form-wrap{padding:30px 24px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// BOILERPLATE DEMO: guard browser mengatur navigasi, bukan keamanan data.
// Produksi: verifikasi sesi dan otorisasi pada server untuk setiap API.
const app=document.getElementById('app');
const SESSION_KEY='ruma.routing.demo.v1';
const TTL=30*60*1000;
let renderId=0, expiryTimer;
const protectedPaths=new Set(['/dashboard','/dashboard/produk','/dashboard/penjualan']);
const allowedPaths=new Set(['/login','/signup',...protectedPaths]);
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getSession(){
 try{
  const s=JSON.parse(sessionStorage.getItem(SESSION_KEY));
  if(s&&typeof s.name==='string'&&s.name.length>0&&s.role==='visitor'&&Number.isFinite(s.expiresAt)&&s.expiresAt>Date.now())return s;
  sessionStorage.removeItem(SESSION_KEY);
 }catch{}
 return null;
}
function navigate(path,replace=false){
 if(!allowedPaths.has(path))path='/login';
 if(replace){history.replaceState(null,'',location.pathname+location.search+'#'+path);render();}
 else if(location.hash==='#'+path)render();
 else location.hash=path;
}
function currentRoute(){
 const raw=location.hash.slice(1)||'/login';
 const split=raw.indexOf('?');
 return {path:split<0?raw:raw.slice(0,split),params:new URLSearchParams(split<0?'':raw.slice(split+1))};
}
function safeNext(params){const next=params.get('next');return protectedPaths.has(next)?next:'/dashboard';}
function logout(){
 try{sessionStorage.removeItem(SESSION_KEY);}catch{}
 navigate('/login',true);
}
function authMarkup(signup,next){
 const other=signup?'login':'signup';
 return `<div class="auth enter"><aside class="story"><a class="brand" href="#/login">RUMA<span>•</span></a><div><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><h2>Ruang nyaman.<br>Awal yang baik.</h2><p>Satu rumah untuk kebutuhan sehari-hari Anda.</p></div><p>RUMA / RUANG UNTUK KESEHARIAN</p></aside><main class="form-wrap"><section class="card"><p class="eyebrow">${signup?'MULAI CERITA ANDA':'SELAMAT DATANG KEMBALI'}</p><h1 tabindex="-1">${signup?'Buat akun RUMA':'Masuk ke RUMA'}</h1><p>${signup?'Simulasikan pendaftaran dan lanjutkan ke ruang Anda.':'Masuk sebagai pengunjung untuk membuka dashboard.'}</p><form id="authForm"><label>Nama lengkap<input name="name" autocomplete="name" minlength="2" maxlength="70" required placeholder="Nama Anda"></label><label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required placeholder="nama@email.com"></label><p class="note">Mode demo: tidak membuat akun nyata, memverifikasi identitas, atau mengirim email. Jangan masukkan data sensitif.</p><p id="formError" class="error" role="alert"></p><button class="full" type="submit">${signup?'Daftar demo':'Masuk demo'} →</button></form><p class="switch">${signup?'Sudah punya akun?':'Belum punya akun?'} <a href="#/${other}?next=${encodeURIComponent(next)}">${signup?'Masuk':'Daftar sekarang'}</a></p><p class="muted">Sesi demo berlaku 30 menit di tab ini.</p></section></main></div>`;
}
function dashboardMarkup(s,path){
 const isProducts=path.endsWith('/produk'),isSales=path.endsWith('/penjualan');
 const title=isProducts?'Pilihan untuk rumah Anda':isSales?'Riwayat belanja Anda':`Selamat datang, ${escapeHTML(s.name)}.`;
 return `<main class="shell enter"><header class="topbar"><a class="brand" href="#/dashboard">RUMA<span>•</span></a><button class="secondary" id="logout">Keluar ↗</button></header><nav class="nav" aria-label="Navigasi dashboard">${[['/dashboard','Ringkasan'],['/dashboard/produk','Produk'],['/dashboard/penjualan','Riwayat belanja']].map(([url,label])=>`<a href="#${url}" ${path===url?'aria-current="page"':''}>${label}</a>`).join('')}</nav><section class="welcome"><p class="eyebrow">RUANG PENGUNJUNG / DEMO</p><h1 tabindex="-1">${title}</h1><p>Autentikasi dan dashboard menggunakan rute berbeda. Muat ulang halaman atau gunakan tombol kembali: sesi dan rute tetap diperiksa.</p></section><section id="dashboardContent" aria-busy="true" aria-label="Konten dashboard"><p role="status">Memuat data contoh…</p><div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section><section class="panel"><h2>Ruang untuk proyek RUMA Anda.</h2><p>Ini boilerplate routing, bukan salinan lengkap katalog dan tabel transaksi dari index.html. Pindahkan komponen proyek asli ke renderer rute yang sesuai.</p><p class="muted">Tidak ada akses admin dalam demo ini. Otorisasi admin harus berasal dari server.</p></section></main>`;
}
// Penundaan ini khusus memperagakan skeleton. Ganti dengan fetch API sungguhan.
async function loadDemoData(path){
 await new Promise(resolve=>setTimeout(resolve,600));
 if(path.endsWith('/produk'))return [['Ruang tamu','Katalog','Tempat komponen produk asli'],['Dapur','Katalog','Tempat komponen produk asli'],['Kamar tidur','Katalog','Tempat komponen produk asli']];
 if(path.endsWith('/penjualan'))return [['Pesanan saya','0','Data contoh, bukan transaksi nyata'],['Dalam proses','0','Data contoh'],['Selesai','0','Data contoh']];
 return [['Favorit Anda','0','Data contoh'],['Pesanan aktif','0','Data contoh'],['Profil','Demo','Sesi tab · 30 menit']];
}
async function render(){
 const id=++renderId;
 clearTimeout(expiryTimer);
 const {path,params}=currentRoute();
 const session=getSession();
 if(!allowedPaths.has(path)){navigate(session?'/dashboard':'/login',true);return;}
 if(protectedPaths.has(path)&&!session){
  history.replaceState(null,'',location.pathname+location.search+'#/login?next='+encodeURIComponent(path));render();return;
 }
 if(session&&(path==='/login'||path==='/signup')){navigate(safeNext(params),true);return;}
 if(!session){
  const signup=path==='/signup',next=safeNext(params);
  document.title=(signup?'Daftar':'Masuk')+' — RUMA';
  app.innerHTML=authMarkup(signup,next);
  document.getElementById('authForm').addEventListener('submit',event=>{
   event.preventDefault();
   const form=event.currentTarget,data=new FormData(form);
   const name=String(data.get('name')).trim(),email=String(data.get('email')).trim();
   if(name.length<2||!email){document.getElementById('formError').textContent='Isi nama dan email yang valid.';return;}
   form.querySelector('button').disabled=true;
   try{
    // Tidak menyimpan kata sandi atau token. Email juga tidak dipersistensikan.
    sessionStorage.setItem(SESSION_KEY,JSON.stringify({name,role:'visitor',expiresAt:Date.now()+TTL}));
    navigate(next,true);
   }catch{
    document.getElementById('formError').textContent='Penyimpanan sesi diblokir browser. Izinkan penyimpanan situs untuk menjalankan demo.';
    form.querySelector('button').disabled=false;
   }
  });
 }else{
  document.title='Dashboard — RUMA';
  app.innerHTML=dashboardMarkup(session,path);
  document.getElementById('logout').addEventListener('click',logout);
  expiryTimer=setTimeout(()=>render(),Math.max(0,session.expiresAt-Date.now()));
  document.querySelector('h1').focus({preventScroll:true});
  const rows=await loadDemoData(path);
  if(id!==renderId)return; // Abaikan hasil lama setelah navigasi atau logout.
  if(!getSession()){render();return;}
  const content=document.getElementById('dashboardContent');
  content.innerHTML='<div class="grid enter">'+rows.map(([label,value,note])=>`<article class="tile"><small>${escapeHTML(label)}</small><strong>${escapeHTML(value)}</strong><small>${escapeHTML(note)}</small></article>`).join('')+'</div>';
  content.setAttribute('aria-busy','false');
 }
 if(!session)document.querySelector('h1').focus({preventScroll:true});
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
window.addEventListener('pageshow',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
render();
</script>
</body>
</html>
